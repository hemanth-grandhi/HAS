spring.application.name=has-backend

# In-memory database for quick demos (no local Postgres needed)
spring.datasource.url=jdbc:h2:mem:has_demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=8080

app.cors.allowed-origin=http://localhost:5173
app.bootstrap.admin.username=admin
app.bootstrap.admin.password=admin123
app.bootstrap.receptionist.username=reception
app.bootstrap.receptionist.password=reception123
app.bootstrap.catering.username=catering
app.bootstrap.catering.password=catering123
app.bootstrap.manager.username=manager
app.bootstrap.manager.password=manager123
